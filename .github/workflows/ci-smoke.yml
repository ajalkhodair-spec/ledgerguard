name: Reviewer Revision Smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reviewer dependencies
        run: python -m pip install -r requirements-reviewer.txt
      - name: Compile Python and shell sources
        run: |
          find experiments runner scripts -name '*.py' -print0 | xargs -0 python -m py_compile
          bash -n poc
          find experiments scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run persistent baseline and receipt tests
        env:
          PYTHONPATH: .
        run: python -W error::ResourceWarning -m unittest discover -s experiments/reviewer_revision -p 'test*.py' -v
      - name: Validate public sample schemas
        run: python experiments/reviewer_revision/validate_public_sample.py
