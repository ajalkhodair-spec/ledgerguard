name: Contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build
        run: forge build --root contracts
      - name: Unit, fuzz, and invariant tests
        run: forge test --root contracts -vv
      - name: Coverage
        run: forge coverage --root contracts --report summary

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'slither-analyzer==0.11.6'
      - run: slither contracts --foundry-out-directory out --json slither-ci.json || test -f slither-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-ci
          path: slither-ci.json
